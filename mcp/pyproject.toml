[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencanvas-mcp"
version = "0.3.0"
description = "MCP server for the live OpenCanvas desktop app"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
]

[project.scripts]
opencanvas-mcp = "opencanvas_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencanvas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/opencanvas_mcp/instructions.md" = "opencanvas_mcp/instructions.md"

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
